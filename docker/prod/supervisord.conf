; StoreZ process supervisor.
;
; Runs php-fpm, nginx, and the Laravel scheduler in one container.
; The scheduler is the piece Dockerfile.render omitted, which meant
; content:sync-scheduled (see bootstrap/app.php) never fired in production.

; Expose a control socket so `supervisorctl status` works inside the
; container for diagnostics (see DEPLOYMENT.md).
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; php-fpm reaps its own workers; don't let supervisor kill the group.
stopasgroup=false
killasgroup=false

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

; schedule:work is the long-running equivalent of a per-minute cron entry.
; The hourly content:sync-scheduled command uses ->onOneServer(), which needs
; an atomic-lock cache store - CACHE_STORE must be redis or database, never file.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
autostart=true
autorestart=true
priority=30
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
stopwaitsecs=70

; No queue worker: the app currently has no ShouldQueue jobs, so
; QUEUE_CONNECTION=sync is correct. If jobs are introduced later, add:
;
; [program:queue]
; command=php /var/www/html/artisan queue:work --tries=3 --timeout=90 --sleep=3
; user=www-data
; autostart=true
; autorestart=true
; stopwaitsecs=100
