# StoreZ in-container nginx.
#
# This sits BEHIND the host's nginx, which terminates TLS and proxies to
# 127.0.0.1:<APP_BIND_PORT>. Keep both layers' client_max_body_size in sync.

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Real client IPs come from the host proxy on the docker bridge, so trust
    # RFC1918 ranges for X-Forwarded-For. Laravel does its own trusting via
    # TrustProxies in bootstrap/app.php; this is just for access logs.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    server {
        listen 8080;
        server_name _;

        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Matches docker/prod/php.ini (20M) and the host vhost.
        client_max_body_size 20M;
        client_body_timeout 120s;

        # Laravel's health endpoint (registered in bootstrap/app.php).
        # Kept out of the access log to avoid drowning it in healthchecks.
        location = /up {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Vite build output is content-hashed, so it can be cached hard.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # Uploaded media, served through the public/storage symlink that the
        # entrypoint creates. Filenames are UUIDs, so they are immutable too.
        location /storage/ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            # Defuse the httpoxy vulnerability.
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            # Long enough for image transcoding and CSV imports.
            fastcgi_read_timeout 120s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Never serve dotfiles (.env, .git, ...) even if one lands in public/.
        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
