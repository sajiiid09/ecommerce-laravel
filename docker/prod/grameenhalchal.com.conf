# StoreZ host nginx vhost.
#
# Install as /etc/nginx/sites-available/grameenhalchal.com.conf and symlink
# into sites-enabled. This is the ONLY file that touches the shared host
# nginx; it adds a server block and changes nothing global.
#
#   sudo ln -s /etc/nginx/sites-available/grameenhalchal.com.conf \
#              /etc/nginx/sites-enabled/grameenhalchal.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain the certificate, which rewrites this file in place to add the
# listen 443 / ssl_certificate directives and the HTTP->HTTPS redirect:
#
#   sudo certbot --nginx -d grameenhalchal.com -d www.grameenhalchal.com
#
# The block below is the pre-certbot (port 80) form.

server {
    listen 80;
    listen [::]:80;

    server_name grameenhalchal.com www.grameenhalchal.com;

    # Must be >= the container's client_max_body_size (20M) or admin image
    # uploads and CSV imports fail with 413. The nginx default is 1M.
    client_max_body_size 20M;

    access_log /var/log/nginx/grameenhalchal.access.log;
    error_log  /var/log/nginx/grameenhalchal.error.log warn;

    # Let certbot answer HTTP-01 challenges without proxying them.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:8092;

        proxy_http_version 1.1;

        # These headers are what TrustProxies in bootstrap/app.php consumes.
        # Without X-Forwarded-Proto the app generates http:// URLs and the
        # secure session cookie is rejected.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Livewire posts to /livewire/update; image transcoding and CSV
        # imports can be slow. Keep this >= the container's fastcgi timeout.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Livewire responses are small and latency-sensitive.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
