; StoreZ production PHP settings.
; Loaded as /usr/local/etc/php/conf.d/99-storez.ini (last wins).

; Uploads. The admin media library accepts images and the catalog importer
; accepts CSVs validated at max:10240 (10 MB). Both nginx layers allow 20M,
; so PHP must not be the narrower limit - stock php-fpm defaults are
; upload_max_filesize=2M / post_max_size=8M, which would silently truncate.
upload_max_filesize = 20M
post_max_size = 24M
max_file_uploads = 30

memory_limit = 512M
max_execution_time = 120

; Image transcoding (GD -> WebP) is the heaviest request path.
max_input_time = 120

expose_php = Off

; Log to stderr so `docker logs` and the json-file driver capture it.
log_errors = On
error_log = /proc/self/fd/2
display_errors = Off
display_startup_errors = Off

date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code never changes inside a running container, so skip the stat() calls.
; A deploy builds a new image, so there is nothing to invalidate.
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
