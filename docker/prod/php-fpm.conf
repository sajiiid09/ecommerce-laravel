; StoreZ php-fpm pool overrides.
; Loaded as /usr/local/etc/php-fpm.d/zz-storez.conf (after www.conf).

[www]
; Listen on loopback rather than the default unix socket, matching the
; fastcgi_pass in docker/prod/nginx.conf.
listen = 127.0.0.1:9000

user = www-data
group = www-data

; Dynamic sizing tuned for a shared VPS: this app is one of several services
; on the box, so it should not try to claim the whole machine. With
; memory_limit=512M these caps bound worst-case RSS at roughly 1.5-2.5 GB.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
; Recycle workers periodically to bound leaks from long-lived GD work.
pm.max_requests = 500

; Surface worker output in `docker logs`.
catch_workers_output = yes
decorate_workers_output = no

; php-fpm's own access log is noise; nginx already logs requests.
access.log = /dev/null

; Log slow requests - useful for spotting pathological image transcodes.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 15s

clear_env = no
