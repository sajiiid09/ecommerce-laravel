<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoreZ Frontend Demo</title>
  <meta name="description" content="StoreZ multi-page e-commerce frontend demo based on the supplied mockups." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            storeblue: '#0756c9',
            storeblue2: '#0047ad',
            storered: '#f10b12',
            navy: '#07366f',
            ink: '#0f172a'
          },
          boxShadow: {
            soft: '0 8px 30px rgba(15,23,42,.08)'
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root{--blue:#0756c9;--red:#f10b12;--ink:#0f172a}
    html{scroll-behavior:smooth}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#fff}
    *{box-sizing:border-box}
    .container-app{max-width:1440px;margin:0 auto;padding-left:24px;padding-right:24px}
    .page-card{border:1px solid #e2e8f0;background:#fff;border-radius:14px}
    .btn-primary{background:#0756c9;color:#fff;border-radius:8px;padding:.72rem 1rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;transition:.2s}
    .btn-primary:hover{background:#0647a6;transform:translateY(-1px)}
    .btn-outline{border:1px solid #0756c9;color:#0756c9;border-radius:8px;padding:.68rem 1rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;background:#fff}
    .btn-danger{background:#ef1018;color:white;border-radius:8px;padding:.72rem 1rem;font-weight:700}
    .field{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:.78rem .9rem;outline:none;background:#fff}
    .field:focus{border-color:#0756c9;box-shadow:0 0 0 3px rgba(7,86,201,.1)}
    .chip{border:1px solid #dbe3ef;border-radius:999px;padding:.5rem .9rem;background:#fff;font-size:.86rem}
    .chip-active{background:#0756c9;color:#fff;border-color:#0756c9}
    .section-title{font-weight:800;font-size:1.35rem;letter-spacing:-.02em}
    .tiny{font-size:.78rem;color:#64748b}
    .price{font-weight:800;color:#ef1018}
    .old-price{text-decoration:line-through;color:#94a3b8;font-size:.82rem;margin-left:.35rem}
    .badge-sale{position:absolute;left:10px;top:10px;background:#ef1018;color:#fff;font-weight:800;font-size:.72rem;padding:.35rem .45rem;border-radius:6px}
    .product-card{border:1px solid #e2e8f0;border-radius:12px;background:#fff;overflow:hidden;transition:.2s}
    .product-card:hover{box-shadow:0 12px 32px rgba(15,23,42,.08);transform:translateY(-2px)}
    .product-img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff}
    .nav-link-active{background:#ef1018}
    .account-link-active{background:#eaf2ff;color:#0756c9;font-weight:700}
    .progress-line{height:4px;background:#e2e8f0;position:absolute;top:26px;left:45px;right:45px;z-index:0}
    .progress-fill{height:4px;background:#16a34a;position:absolute;top:26px;left:45px;z-index:1}
    .sticky-summary{position:sticky;top:22px}
    body.drawer-open{overflow:hidden}
    #cart-drawer-overlay{transition:opacity .25s ease}
    #cart-drawer{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
    @media (max-width: 1024px){
      .desktop-nav{display:none}
      .mobile-only{display:flex!important}
      .container-app{padding-left:14px;padding-right:14px}
    }
  </style>
</head>

<div id="app"></div>

function openCartDrawer(){
  const shell=document.querySelector('#cart-drawer-shell');
  const overlay=document.querySelector('#cart-drawer-overlay');
  const drawer=document.querySelector('#cart-drawer');
  if(!shell || !overlay || !drawer) return;
  shell.classList.remove('pointer-events-none');
  shell.setAttribute('aria-hidden','false');
  document.body.classList.add('drawer-open');
  requestAnimationFrame(()=>{
    overlay.classList.remove('opacity-0');
    drawer.classList.remove('translate-x-full');
  });
}

function closeCartDrawer(){
  const shell=document.querySelector('#cart-drawer-shell');
  const overlay=document.querySelector('#cart-drawer-overlay');
  const drawer=document.querySelector('#cart-drawer');
  if(!shell || !overlay || !drawer) return;
  overlay.classList.add('opacity-0');
  drawer.classList.add('translate-x-full');
  shell.setAttribute('aria-hidden','true');
  document.body.classList.remove('drawer-open');
  setTimeout(()=>shell.classList.add('pointer-events-none'),300);
}

function render(){
  const route=(location.hash||'#home').slice(1);
  const pages={
    home:homePage, category:categoryPage, product:productPage, cart:cartPage, checkout:checkoutPage,
    'checkout-success':successPage, success:successPage, search:searchPage, register:()=>authPage('register'),
    login:()=>authPage('login'), wishlist:wishlistPage, account:accountPage, orders:ordersPage,
    offers:offersPage, brand:brandPage, tracking:trackingPage
  };
  const page=(pages[route]||homePage)();
  document.querySelector('#app').innerHTML=header()+cartDrawer()+`<div id="page-root">${page}</div>`+footer();
  if(window.lucide) lucide.createIcons();
  if(window.gsap) gsap.from('#page-root',{opacity:0,y:8,duration:.35,ease:'power2.out'});
  window.scrollTo(0,0);
  bindEvents();
}
function bindEvents(){
  const form=document.querySelector('#global-search');
  if(form) form.addEventListener('submit',e=>{e.preventDefault(); location.hash='search';});
}
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-action]');
  if(!btn) return;
  const id=Number(btn.dataset.id), action=btn.dataset.action;

  if(action==='open-cart-drawer'){
    e.preventDefault();
    openCartDrawer();
    return;
  }

  if(action==='close-cart-drawer'){
    if(btn.id==='cart-drawer-overlay') e.preventDefault();
    closeCartDrawer();
    return;
  }

  if(action==='add-cart'){
    const found=state.cart.find(c=>c.id===id);
    found ? found.qty++ : state.cart.push({id,qty:1});
    render();
    requestAnimationFrame(openCartDrawer);
    return;
  }

  if(action==='wishlist'){
    state.wishlist.includes(id)
      ? state.wishlist=state.wishlist.filter(x=>x!==id)
      : state.wishlist.push(id);
    render();
    return;
  }

  if(action==='remove-cart'){
    state.cart=state.cart.filter(x=>x.id!==id);
    render();
    requestAnimationFrame(openCartDrawer);
    return;
  }

  if(action==='qty-plus'){
    const c=state.cart.find(x=>x.id===id);
    if(c)c.qty++;
    render();
    requestAnimationFrame(openCartDrawer);
    return;
  }

  if(action==='qty-minus'){
    const c=state.cart.find(x=>x.id===id);
    if(c){
      c.qty--;
      if(c.qty<=0) state.cart=state.cart.filter(x=>x.id!==id);
    }
    render();
    requestAnimationFrame(openCartDrawer);
    return;
  }
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeCartDrawer();
});
window.addEventListener('hashchange',render);
window.addEventListener('DOMContentLoaded',render);
</script>
